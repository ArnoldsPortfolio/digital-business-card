<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnold Morales | Software Engineer</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #5b6475;
  --accent: #1d6fe8;
  --accent-text: #ffffff;
  --border: #e3e8f0;
  --btn: #eef3fc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --card: #131c2e;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #4b8ff5;
    --accent-text: #0b1220;
    --border: #243049;
    --btn: #1b2740;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --card: #131c2e;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #4b8ff5;
  --accent-text: #0b1220;
  --border: #243049;
  --btn: #1b2740;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 16px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 24px 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
}
.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 700;
  margin: 0 auto 16px;
}
.photo {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 16px;
  border: 3px solid var(--accent);
}
h1 { font-size: 26px; margin: 0 0 4px; }
.title { color: var(--accent); font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.tag { font-size: 15px; color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
.details { font-size: 15px; font-weight: 600; line-height: 1.6; margin: -12px 0 20px; user-select: all; }
.actions { display: grid; gap: 10px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--btn);
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  font-weight: 600;
  border: 1px solid var(--border);
  cursor: pointer;
  font-family: inherit;
  width: 100%;
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn:active { transform: scale(0.98); }
.qr {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.qr-box {
  display: inline-block;
  background: #ffffff;
  padding: 10px;
  border-radius: 12px;
  line-height: 0;
}
.qr-box svg { width: 140px; height: 140px; display: block; }
.qr p { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.toast { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 12px; }
</style>
</head>
